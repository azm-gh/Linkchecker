<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Checker</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1><span>Link Checker</span></h1>
            <p>High-performance, concurrent web crawler powered by Python.</p>
        </header>

        <div id="auth-container" class="glass-card controls-card" style="text-align: center; margin-bottom: 20px;">
            <h2 style="margin-bottom: 15px;">Login or Register</h2>
            <input type="email" id="email" placeholder="Email" required style="display:block; width:100%; margin-bottom: 10px; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box;">
            <input type="password" id="password" placeholder="Password" required style="display:block; width:100%; margin-bottom: 20px; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box;">
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 12px;">
                <button id="login-btn" style="padding: 10px 20px;">Login</button>
                <button id="register-btn" style="padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">Register</button>
            </div>
            <a href="#" id="forgot-password-link" style="color: var(--accent-primary); font-size: 0.9rem; text-decoration: none;">Forgot Password?</a>
            <p id="auth-error" style="color: var(--error); margin-top: 15px;"></p>
        </div>

        <main id="app-dashboard" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <p>Logged in as: <strong id="user-email"></strong></p>
                <button id="logout-btn" style="padding: 8px 15px; font-size: 0.8rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; color: white; cursor: pointer;">Logout</button>
            </div>
            <div class="glass-card controls-card">
                <form id="scan-form">
                    <div class="input-group">
                        <label for="url">Target URL</label>
                        <input type="url" id="url" placeholder="https://example.com" required>
                    </div>
                    
                    <div class="sliders-row">
                        <div class="input-group slider-group">
                            <label for="concurrency" title="Limits how many requests happen at the exact same millisecond. Helps avoid instant bans.">
                                Scan Speed (Simultaneous Connections): <span id="concurrency-val">50</span>
                            </label>
                            <input type="range" id="concurrency" min="1" max="100" value="50">
                        </div>
                        <div class="input-group slider-group">
                            <label for="delay" title="Pauses the engine before firing the next batch of requests. Essential for bypassing rate limits.">
                                Request Pacing (Delay in seconds): <span id="delay-val">0.0</span>
                            </label>
                            <input type="range" id="delay" min="0" max="5" step="0.1" value="0.0">
                        </div>
                    </div>

                    <button type="submit" id="scan-btn">
                        <span class="btn-text">Start Scan</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>
            </div>

            <div class="status-message" id="status-message"></div>

            <div class="glass-card summary-card hidden" id="summary-card">
                <div class="stat-box">
                    <h3>Total Found</h3>
                    <p id="stat-total">0</p>
                </div>
                <div class="stat-box stat-alive">
                    <h3>Alive (200 OK)</h3>
                    <p id="stat-alive">0</p>
                </div>
                <div class="stat-box stat-dead">
                    <h3>Dead / Error</h3>
                    <p id="stat-dead">0</p>
                </div>
                <div class="stat-box">
                    <h3>Total Time</h3>
                    <p id="stat-time">-</p>
                </div>
            </div>

            <div class="table-container hidden" id="results-container">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Response Time</th>
                            <th>URL</th>
                            <th>Error</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
